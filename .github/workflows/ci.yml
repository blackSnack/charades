name: Build, test and deploy
on:
  push:
    branches: [main, feat/react-pwa, feat/vfx-lab, fix/update-footer, feat/deck-themes, fix/card-readability, fix/card-fit-stability, fix/turn-count-abandon, fix/question-abandon, feat/four-reference-decks, fix/thin-flow-rim, fix/magicui-shine-border]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: party-deck-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate-bank
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/deck-art-requirements.txt
      - run: python scripts/build-deck-art.py
      - run: npm run build
      - run: npm run check:vfx-size
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            test-results/
            public/deck-art/v1/manifest.json
          if-no-files-found: ignore
      - name: Verify release tag is available
        if: github.ref == 'refs/heads/main'
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$refs" ]; then
            target="$(printf '%s\n' "$refs" | tail -n 1 | cut -f1)"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::Release $tag belongs to a different commit; bump package.json and release-notes.json."
              exit 1
            fi
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish GitHub Release after Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          node -e 'const r=require("./release-notes.json"); console.log(r.notes.map(n=>"- "+n).join("\n"))' > /tmp/party-deck-notes.md
          printf '\n[在线游戏](https://blacksnack.github.io/charades/)\n' >> /tmp/party-deck-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Party Deck $tag" --notes-file /tmp/party-deck-notes.md
          fi
